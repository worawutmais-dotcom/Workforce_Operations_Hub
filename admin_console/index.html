<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BVN Package | Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a1f38;--navy2:#13324f;--panel:#13324f;--ink:#0f223e;--muted:#64748b;
    --line:#e6ebf2;--bg:#f1f4f9;--card:#ffffff;--blue:#2563eb;--blue-soft:#e7efff;
    --green:#0b8f62;--green-soft:#e2f6ee;--amber:#b7791f;--amber-soft:#fdf3dd;
    --red:#d64545;--red-soft:#fdeaea;--radius:16px;--radius-sm:10px;
    --shadow:0 1px 2px rgba(15,34,56,.04),0 6px 20px rgba(15,34,56,.06);
    --shadow-lg:0 10px 40px rgba(15,34,56,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans Thai","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .value,td.num,th.num,.card .value{font-feature-settings:"tnum" 1}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--ink)}
  h1,h2,h3{margin:0}
  a{color:var(--blue)}

  /* ---------- Login ---------- */
  #login{position:fixed;inset:0;display:grid;place-items:center;
    background:radial-gradient(1200px 700px at 15% -10%,#1e5aa8,#0a1f38 60%),var(--navy);padding:20px;z-index:40}
  .login-card{width:100%;max-width:410px;background:var(--card);border-radius:20px;
    padding:34px 32px;box-shadow:0 40px 90px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.06)}
  .login-card .logo{font-weight:800;font-size:21px;letter-spacing:-.5px;color:var(--navy);display:flex;flex-direction:column}
  .login-card .logo::before{content:"";width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 10px 24px rgba(37,99,235,.45);margin-bottom:14px}
  .login-card .logo small{font-weight:500;color:var(--muted);font-size:12px;margin-top:5px;letter-spacing:.3px}
  .field{margin-top:16px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;
    padding:11px 12px;background:#fff;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
  .login-err{margin-top:14px;font-size:13px;color:var(--red);min-height:18px}
  .btn{border:0;border-radius:10px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 2px 8px rgba(37,99,235,.25);transition:filter .15s,transform .05s}
  .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:translateY(1px)}
  .btn.sub,.btn.ghost,.btn.danger,.btn.ok{box-shadow:none}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.block{width:100%;margin-top:20px;padding:13px}
  .btn.ghost{background:var(--blue-soft);color:#1552b8}
  .btn.sub{background:#eef2f7;color:var(--ink)}
  .btn.danger{background:var(--red-soft);color:#b52c2c}
  .btn.ok{background:var(--green-soft);color:#0a7350}
  .btn.sm{padding:7px 10px;font-size:13px;border-radius:8px}

  /* ---------- Shell ---------- */
  #app{display:none;grid-template-columns:238px 1fr;min-height:100vh}
  .side{background:linear-gradient(180deg,#0c2744,#07162a);color:#dbe7f2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid rgba(255,255,255,.04)}
  .side .brand{font-weight:800;font-size:18px;letter-spacing:-.4px;padding:24px 20px 18px;display:flex;align-items:center;gap:10px}
  .side .brand::before{content:"";width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 4px 12px rgba(37,99,235,.5);flex:none}
  .side .brand small{display:block;font-weight:500;color:#8fa9c4;font-size:11px;margin-top:3px;letter-spacing:.4px}
  .nav{display:flex;flex-direction:column;gap:2px;padding:8px 12px;flex:1;overflow:auto}
  .nav button{border:0;background:transparent;color:#a9c0d8;text-align:left;border-radius:10px;
    padding:11px 13px;display:flex;align-items:center;gap:11px;font-size:14px;transition:background .15s,color .15s}
  .nav button .ico{width:20px;text-align:center;opacity:.85;font-size:15px}
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav button.active{background:var(--blue);color:#fff;font-weight:600;box-shadow:0 8px 20px rgba(37,99,235,.4)}
  .nav .pill{margin-left:auto;background:#ff5d5d;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;min-width:18px;text-align:center}
  .side .foot{padding:14px 18px;border-top:1px solid #1d3b58;font-size:12px;color:#8fa9c4}
  .side .foot b{color:#cfe0f0;display:block;font-weight:600}

  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:14px;padding:16px 26px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .topbar .page-title{font-size:18px;font-weight:800;letter-spacing:-.3px}
  .topbar .page-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .topbar .spacer{flex:1}
  .asof{font-size:12px;color:var(--muted);text-align:right}
  .content{padding:24px 26px 60px;max-width:1360px;width:100%}

  .page{display:none}
  .page.active{display:block}

  /* ---------- Cards ---------- */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#3b82f6,#2563eb);opacity:0;transition:opacity .15s}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .card:hover::before{opacity:1}
  .card .label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.2px}
  .card .value{font-size:28px;font-weight:800;margin:10px 0 4px;letter-spacing:-.6px;color:var(--navy)}
  .card .note{font-size:12px;color:var(--muted)}
  .card .note.warn{color:var(--amber)}
  .card .note.bad{color:var(--red)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:18px;overflow:hidden}
  .panel .head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel .head h2,.panel .head>b{font-size:15px;font-weight:700;letter-spacing:-.2px;color:var(--navy)}
  .panel .head .spacer{flex:1}
  .panel .body{padding:16px 18px}
  .panel .body.flush{padding:0}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .toolbar input[type=search],.toolbar input[type=text],.toolbar input[type=date],.toolbar select{
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;outline:none}
  .toolbar input:focus,.toolbar select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}

  /* ---------- Table ---------- */
  table{border-collapse:collapse;width:100%}
  thead th{position:sticky;top:0;background:#f7f9fc;text-align:left;font-size:11px;color:var(--muted);
    font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:14px 16px;border-bottom:1px solid #eef2f6;vertical-align:middle}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:#f6f9ff}
  tbody tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .person{font-weight:700}
  .person .sub{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;background:var(--green-soft);color:#0a7350}
  .badge.amber{background:var(--amber-soft);color:#946200}
  .badge.red{background:var(--red-soft);color:#b52c2c}
  .badge.grey{background:#eef2f6;color:#5a6b7e}
  .badge.blue{background:var(--blue-soft);color:#1552b8}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

  .notice{display:flex;gap:10px;align-items:flex-start;border-left:4px solid var(--amber);background:var(--amber-soft);
    color:#7a5600;padding:12px 14px;border-radius:0 8px 8px 0;font-size:13px;margin:0 0 14px}
  .notice.blue{border-color:var(--blue);background:var(--blue-soft);color:#174e9c}

  /* ---------- Modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(10,28,48,.55);display:none;place-items:center;padding:20px;z-index:30}
  .scrim.show{display:grid}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:520px;box-shadow:0 30px 80px rgba(0,0,0,.4);max-height:90vh;display:flex;flex-direction:column}
  .modal .m-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .modal .m-head h3{font-size:16px;font-weight:800}
  .modal .m-head .x{margin-left:auto;border:0;background:#eef2f6;border-radius:8px;width:30px;height:30px;color:var(--muted);font-size:18px}
  .modal .m-body{padding:18px 20px;overflow:auto}
  .modal .m-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .check{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:14px}
  .check input{width:18px;height:18px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .secretbox{background:var(--navy);color:#eaf4ff;border-radius:10px;padding:14px 16px;margin-top:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .secretbox b{display:block;font-size:12px;color:#9ec2ea;font-family:inherit;font-weight:600;margin-bottom:4px}
  .secretbox .v{font-size:18px;letter-spacing:1px;user-select:all}

  /* ---------- Toast + loader ---------- */
  .toast{position:fixed;right:22px;bottom:22px;background:var(--navy);color:#fff;padding:13px 16px;border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.3);transform:translateY(140%);transition:.28s;max-width:360px;z-index:50;font-size:14px}
  .toast.show{transform:translateY(0)}
  .toast.bad{background:#7a1f1f}
  .toast.good{background:#0a6d4b}
  .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
  .btn.ghost .spin,.btn.sub .spin{border-color:rgba(21,82,184,.3);border-top-color:#1552b8}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{padding:40px;text-align:center;color:var(--muted)}

  @media(max-width:900px){
    #app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;width:238px;transform:translateX(-100%);transition:.25s;z-index:25}
    .side.open{transform:none;box-shadow:0 0 0 2000px rgba(0,0,0,.4)}
    .cards{grid-template-columns:repeat(2,1fr)}
    .menu-btn{display:inline-flex!important}
  }
  @media(max-width:560px){.cards{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.content{padding:18px 14px 50px}}
  .menu-btn{display:none;border:0;background:#eef2f6;border-radius:8px;width:36px;height:36px;font-size:18px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="logo">BVN PACKAGE<small>Admin Console · ระบบหลังบ้าน</small></div>
    <div class="field">
      <label>Apps Script Endpoint</label>
      <input id="inEndpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec" required>
    </div>
    <div class="field">
      <label>Admin Token</label>
      <input id="inToken" type="password" placeholder="ADMIN_API_KEY" required>
      <div class="hint">Token เก็บไว้เฉพาะในหน่วยความจำของแท็บนี้ (sessionStorage) ไม่บันทึกลงดิสก์</div>
    </div>
    <div class="field">
      <label>ชื่อผู้อนุมัติ (สำหรับ audit trail)</label>
      <input id="inReviewer" type="text" placeholder="เช่น Worawut">
    </div>
    <div class="login-err" id="loginErr"></div>
    <button class="btn block" id="loginBtn" type="submit">เข้าสู่ระบบ</button>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <aside class="side" id="side">
    <div class="brand">BVN PACKAGE<small>ADMIN CONSOLE</small></div>
    <nav class="nav" id="nav">
      <button data-page="dashboard" class="active"><span class="ico">▦</span> ภาพรวม</button>
      <button data-page="owner"><span class="ico">◆</span> เจ้าของธุรกิจ</button>
      <button data-page="employees"><span class="ico">♟</span> พนักงาน</button>
      <button data-page="approvals"><span class="ico">✔</span> คิวอนุมัติ <span class="pill" id="navApprovals" style="display:none">0</span></button>
      <button data-page="payroll"><span class="ico">฿</span> เงินเดือน</button>
      <button data-page="advances"><span class="ico">⇅</span> เบิกเงินล่วงหน้า <span class="pill" id="navAdvances" style="display:none">0</span></button>
      <button data-page="payrules"><span class="ico">⚖</span> เรตค่าจ้าง</button>
      <button data-page="invoices"><span class="ico">▤</span> ใบแจ้งหนี้</button>
    </nav>
    <div class="foot">
      <b id="footReviewer">—</b>
      ผู้ดูแลระบบ · <a href="#" id="logoutLink" style="color:#9ec2ea">ออกจากระบบ</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div>
        <div class="page-title" id="pageTitle">ภาพรวม</div>
        <div class="page-sub" id="pageSub">สถานะที่ต้องตัดสินใจวันนี้</div>
      </div>
      <div class="spacer"></div>
      <div class="asof" id="asof"></div>
      <button class="btn sub sm" id="refreshBtn">↻ รีเฟรช</button>
    </div>

    <div class="content">
      <section class="page active" id="page-dashboard"></section>
      <section class="page" id="page-owner"></section>
      <section class="page" id="page-employees"></section>
      <section class="page" id="page-approvals"></section>
      <section class="page" id="page-payroll"></section>
      <section class="page" id="page-advances"></section>
      <section class="page" id="page-payrules"></section>
      <section class="page" id="page-invoices"></section>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =================================================================
   BVN Package Admin Console — single-file, vanilla JS.
   Talks to the Apps Script Operations API (see apps_script/Code.gs).
   ================================================================= */
"use strict";

const DEFAULT_ENDPOINT = "https://script.google.com/macros/s/AKfycbw_Jf5Wy1WaLtUQEs7EDNaR-vs5tKcfqlnPCrYjIJNWUJV1tUBBnWOjcSHzu9KzeCGU/exec";
const SS = sessionStorage, LS = localStorage;

/* ---------- ผู้ออกใบแจ้งหนี้ (หัวบิล) ---------- */
const ISSUER = {
  name: "บริษัท พนมพร พาณิชย์ จำกัด",
  nameEn: "Phanomporn Phanich Co., Ltd.",
  address: "479/162 ซอยสุทธิพร แขวงดินแดง เขตดินแดง กรุงเทพมหานคร 10400",
  phone: "096-797-9923",
  taxId: "0105569191266",
};

const state = {
  endpoint: "",
  token: "",
  reviewer: "",
  employees: [],         // cached admin_list_employees
  empById: {},
  page: "dashboard",
};

/* ---------- small DOM helpers ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const el = (html) => { const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s==null?"":s).replace(/[&<>"]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmtBaht = (n) => "฿" + Number(n||0).toLocaleString("th-TH",{minimumFractionDigits:0,maximumFractionDigits:2});
const fmtInt = (n) => Number(n||0).toLocaleString("th-TH");
const fmtHours = (minutes) => (Number(minutes||0)/60).toLocaleString("th-TH",{maximumFractionDigits:1}) + " ชม.";
const todayISO = () => new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Bangkok"});
function fmtDateTime(iso){ if(!iso) return "—"; const d=new Date(iso); return isNaN(d)?esc(iso):d.toLocaleString("th-TH",{dateStyle:"medium",timeStyle:"short"}); }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso+"T00:00:00+07:00"); return isNaN(d)?esc(iso):d.toLocaleDateString("th-TH",{dateStyle:"medium"}); }

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, kind=""){
  const t=$("#toast"); t.className="toast show "+kind; t.textContent=msg;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3200);
}

/* ---------- API ---------- */
async function api(action, fields={}){
  // text/plain avoids a CORS preflight; Apps Script parses the body as JSON regardless.
  const res = await fetch(state.endpoint, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ action, adminToken: state.token, ...fields }),
    redirect:"follow",
  });
  let body;
  try { body = await res.json(); }
  catch(e){ throw new Error("เซิร์ฟเวอร์ตอบกลับไม่ใช่ JSON (ตรวจสอบ endpoint และการ deploy)"); }
  if(!body || typeof body!=="object") throw new Error("รูปแบบคำตอบไม่ถูกต้อง");
  if(!body.ok) throw new Error(body.message || "คำขอไม่สำเร็จ");
  return body.data || {};
}
// run a button into a loading state while awaiting
async function withBtn(btn, fn){
  if(!btn) return fn();
  const html=btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="spin"></span> กำลังทำงาน…';
  try{ return await fn(); } finally{ btn.disabled=false; btn.innerHTML=html; }
}

/* ---------- modal ---------- */
function openModal(title, bodyNode, footNodes){
  const m=$("#modal");
  m.innerHTML="";
  const head=el(`<div class="m-head"><h3>${esc(title)}</h3><button class="x" aria-label="close">×</button></div>`);
  head.querySelector(".x").onclick=closeModal;
  const body=el(`<div class="m-body"></div>`); body.appendChild(bodyNode);
  const foot=el(`<div class="m-foot"></div>`); (footNodes||[]).forEach(n=>foot.appendChild(n));
  m.append(head, body, foot);
  $("#scrim").classList.add("show");
}
function closeModal(){ $("#scrim").classList.remove("show"); $("#modal").innerHTML=""; }
$("#scrim").addEventListener("click", e=>{ if(e.target.id==="scrim") closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

function confirmDialog(title, message, {danger=false, okText="ยืนยัน"}={}){
  return new Promise(resolve=>{
    const body=el(`<div><p style="margin:0;line-height:1.6">${message}</p></div>`);
    const cancel=el(`<button class="btn sub">ยกเลิก</button>`); cancel.onclick=()=>{closeModal();resolve(false);};
    const ok=el(`<button class="btn ${danger?"danger":""}">${esc(okText)}</button>`);
    ok.onclick=()=>{closeModal();resolve(true);};
    openModal(title, body, [cancel, ok]);
  });
}

/* field factory for forms */
function field(label, inputHTML, hint){
  return el(`<div class="field"><label>${esc(label)}</label>${inputHTML}${hint?`<div class="hint">${hint}</div>`:""}</div>`);
}

/* =================================================================
   AUTH
   ================================================================= */
async function doLogin(e){
  e.preventDefault();
  const endpoint=$("#inEndpoint").value.trim();
  const token=$("#inToken").value.trim();
  const reviewer=$("#inReviewer").value.trim();
  const errBox=$("#loginErr"); errBox.textContent="";
  if(!endpoint||!token){ errBox.textContent="กรุณากรอก endpoint และ token"; return; }
  state.endpoint=endpoint; state.token=token; state.reviewer=reviewer;
  await withBtn($("#loginBtn"), async ()=>{
    try{
      const data=await api("dashboard");          // verifies admin token
      SS.setItem("bvn_token", token);
      LS.setItem("bvn_endpoint", endpoint);
      LS.setItem("bvn_reviewer", reviewer);
      enterApp(data);
    }catch(err){
      errBox.textContent = /authentication/i.test(err.message) ? "Admin token ไม่ถูกต้อง" : err.message;
    }
  });
}
function enterApp(dashboardData){
  $("#login").style.display="none";
  $("#app").style.display="grid";
  $("#footReviewer").textContent = state.reviewer || "ผู้ดูแลระบบ";
  renderDashboard(dashboardData);
  // warm the employee cache (used by many pages)
  loadEmployees().catch(()=>{});
  refreshApprovalBadge();
}
function logout(){
  SS.removeItem("bvn_token");
  state.token="";
  location.reload();
}

const PAGES = {

  owner:{title:"เจ้าของธุรกิจ", sub:"ใครต้องจ่ายเท่าไร · วันจ่าย · วันทำงาน · เวลาเข้า-ออก", load:()=>renderOwner()},
  employees:{title:"พนักงาน", sub:"สร้าง แก้ไข ปิดใช้งาน และตั้งรหัสผ่าน", load:()=>renderEmployees()},
  approvals:{title:"คิวอนุมัติ", sub:"คำขอลา และ OT / แก้ไขเวลา", load:()=>renderApprovals()},
  payroll:{title:"เงินเดือน", sub:"พรีวิวค่าแรง (gross) · ล็อกงวด · ประวัติ", load:()=>renderPayroll()},
  advances:{title:"เบิกเงินล่วงหน้า", sub:"อนุมัติคำขอเบิกเงิน และบันทึกการจ่าย", load:()=>renderAdvances()},
  payrules:{title:"เรตค่าจ้าง", sub:"ตั้งฐานค่าจ้าง OT และวันพิเศษต่อพนักงาน", load:()=>renderPayrules()},
  invoices:{title:"ใบแจ้งหนี้", sub:"ออกบิล ติดตามสถานะ และบันทึกการชำระ", load:()=>renderInvoices()},
};
function go(page){
  if(!PAGES[page]) return;
  state.page=page;
  $("#nav").querySelectorAll("button").forEach(b=>b.classList.toggle("active", b.dataset.page===page));
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active", p.id==="page-"+page));
  $("#pageTitle").textContent=PAGES[page].title;
  $("#pageSub").textContent=PAGES[page].sub;
  $("#side").classList.remove("open");
  PAGES[page].load();
}
$("#nav").addEventListener("click", e=>{ const b=e.target.closest("button[data-page]"); if(b) go(b.dataset.page); });
$("#refreshBtn").addEventListener("click", ()=>{ PAGES[state.page].load(); refreshApprovalBadge(); });
$("#menuBtn").addEventListener("click", ()=>$("#side").classList.toggle("open"));
$("#logoutLink").addEventListener("click", e=>{e.preventDefault();logout();});

function skeleton(node){ node.innerHTML=`<div class="loading"><span class="spin" style="border-color:#cbd5e1;border-top-color:#1d6ef5"></span><div style="margin-top:10px">กำลังโหลดข้อมูล…</div></div>`; }
function errorBox(node, err, retry){
  node.innerHTML="";
  const box=el(`<div class="panel"><div class="body"><div class="notice">⚠ โหลดข้อมูลไม่สำเร็จ: ${esc(err.message)}</div></div></div>`);
  const btn=el(`<button class="btn sub sm">ลองใหม่</button>`); btn.onclick=retry;
  box.querySelector(".body").appendChild(btn);
  node.appendChild(box);
}

/* shared employee cache */
async function loadEmployees(force){
  if(state.employees.length && !force) return state.employees;
  const data=await api("admin_list_employees");
  state.employees=data.employees||[];
  state.empById={}; state.employees.forEach(e=>state.empById[e.id]=e);
  return state.employees;
}
function empName(id){ const e=state.empById[id]; return e?e.name:id; }

      <div id="pwReqPanel"></div>
      <div class="panel">
        <div class="head">
          <div class="toolbar"><input type="search" id="empSearch" placeholder="ค้นหา ชื่อ / รหัส / แผนก" style="width:260px"></div>
          <div class="spacer"></div>

        </div>

          <tbody id="empRows"></tbody></table>
        </div>
      </div>`;

      tb.innerHTML=rows.map(e=>`
        <tr>
          <td class="person">${esc(e.name)}<span class="sub">${esc(e.id)}</span></td>
          <td>${esc(e.role||"—")}<span class="sub">${esc(e.department||"")}</span></td>
          <td>${esc(e.siteId||"—")}</td>
          <td>${e.locationRequired?'<span class="badge blue">บังคับ GPS</span>':'<span class="badge grey">ไม่บังคับ</span>'}</td>
          <td><code style="font-size:13px">${esc(e.passwordHash||"—")}</code></td>

    };

async function loadPwRequests(){
  const panel=$("#pwReqPanel"); if(!panel) return;
  try{
    const data=await api("admin_list_password_requests");
    const reqs=data.requests||[];
    if(!reqs.length){ panel.innerHTML=""; return; }
    panel.innerHTML=`<div class="panel" style="border-left:3px solid #e0a800">
      <div class="head"><b>คำขอรีเซ็ตรหัสผ่าน</b> <span class="badge blue">${fmtInt(reqs.length)}</span></div>
      <div class="body flush"><table><thead><tr><th>พนักงาน</th><th>ขอเมื่อ</th><th></th></tr></thead>
      <tbody>${reqs.map(r=>`<tr><td class="person">${esc(r.name)}<span class="sub">${esc(r.employeeId)}</span></td>
        <td>${fmtDateTime(r.requestedAt)}</td>
        <td><div class="row-actions"><button class="btn ok sm" data-pwr="${esc(r.requestId)}" data-emp="${esc(r.employeeId)}">ออกรหัสใหม่</button></div></td></tr>`).join("")}</tbody></table></div></div>`;

async function issueResetForRequest(employeeId, requestId){
  const emp=state.empById[employeeId];
  if(!await confirmDialog("ออกรหัสผ่านใหม่", `สุ่มรหัสผ่านใหม่ให้ <b>${esc(emp?emp.name:employeeId)}</b> (${esc(employeeId)})?`, {okText:"ออกรหัสใหม่"})) return;
  try{ const data=await api("admin_reset_employee_password",{employeeId, requestId, reviewer:state.reviewer||"Admin"});
    showSecret("ออกรหัสผ่านใหม่แล้ว", [["Employee ID", employeeId],["รหัสผ่าน", data.temporaryPassword]], "แจ้งรหัสนี้ให้พนักงาน · ระบบจำไว้ถาวร");
    renderEmployees();
  }catch(err){ toast(err.message,"bad"); }
}

function employeeDialog(emp){
  const isEdit=!!emp;
  const body=el(`<div></div>`);
  body.append(
    field("ชื่อ-นามสกุล", `<input id="fName" type="text" value="${esc(emp?.name||"")}" required>`),
    el(`<div class="grid2"></div>`),
  );
  const g=body.querySelector(".grid2");
  g.append(
    field("ตำแหน่ง", `<input id="fRole" type="text" value="${esc(emp?.role||"")}" placeholder="Employee">`),
    field("แผนก", `<input id="fDept" type="text" value="${esc(emp?.department||"")}">`),
  );
  body.append(field("รหัสไซต์ (Work site ID)", `<input id="fSite" type="text" value="${esc(emp?.siteId||"")}" required>`,
    "ต้องตรงกับแถวในชีต Work_Sites ถึงจะเช็กอินแบบบังคับ GPS ได้"));
  body.append(field("รหัสผ่าน", `<input id="fPw" type="text" value="${esc(emp?.passwordHash||"")}" placeholder="${isEdit?"พิมพ์เพื่อเปลี่ยนรหัส":"เว้นว่าง = สุ่มให้อัตโนมัติ"}">`,
    "รหัสผ่านเก็บแบบข้อความธรรมดา (ใช้ภายในทีม) — แอดมินดูและตั้งเองได้"));
  const chk=el(`<label class="check"><input type="checkbox" id="fLoc" ${(!emp||emp.locationRequired)?"checked":""}> บังคับ GPS ตอนเช็กอิน</label>`);
  body.append(chk);
  if(isEdit){
    const st=el(`<label class="check"><input type="checkbox" id="fActive" ${emp.status==="active"?"checked":""}> พนักงานใช้งานอยู่ (active)</label>`);
    body.append(st);
  }

  const cancel=el(`<button class="btn sub">ยกเลิก</button>`); cancel.onclick=closeModal;
  const save=el(`<button class="btn">${isEdit?"บันทึก":"สร้างพนักงาน"}</button>`);
  save.onclick=()=>withBtn(save, async ()=>{
    const name=$("#fName").value.trim(), site=$("#fSite").value.trim();
    if(!name||!site){ toast("ต้องกรอกชื่อและรหัสไซต์","bad"); return; }
    const fields={
      name, role:$("#fRole").value.trim(), department:$("#fDept").value.trim(),
      siteId:site, locationRequired:$("#fLoc").checked, password:$("#fPw").value.trim(), updatedBy:state.reviewer||"Admin",
    };
    if(isEdit){ fields.employeeId=emp.id; fields.status=$("#fActive").checked?"active":"inactive"; }
    try{
      const data=await api("admin_upsert_employee", fields);
      closeModal();
      await loadEmployees(true); renderEmployees();
      if(!isEdit && data.initialPassword) showSecret("สร้างพนักงานสำเร็จ",
        [["Employee ID", data.employee?.id||""],["รหัสผ่าน", data.initialPassword]],
        "ดู/แก้รหัสได้ภายหลังที่คอลัมน์รหัสผ่านหรือปุ่มแก้ไข");
      else toast("บันทึกพนักงานแล้ว","good");
    }catch(err){ toast(err.message,"bad"); }
  });
  openModal(isEdit?`แก้ไข ${emp.name}`:"เพิ่มพนักงานใหม่", body, [cancel, save]);
}

async function resetPassword(emp){
  if(!await confirmDialog("ตั้งรหัสผ่านใหม่", `สุ่มรหัสผ่านใหม่ให้ <b>${esc(emp.name)}</b> (${esc(emp.id)})?<br>พนักงานต้องใช้รหัสใหม่นี้ในการเข้าสู่ระบบครั้งถัดไป<br><span class="sub">หรือกด “แก้ไข” เพื่อตั้งรหัสที่ต้องการเองก็ได้</span>`, {okText:"สุ่มรหัสใหม่"})) return;
  try{
    const data=await api("admin_reset_employee_password",{employeeId:emp.id});
    showSecret("ตั้งรหัสผ่านใหม่แล้ว", [["Employee ID", emp.id],["รหัสผ่าน", data.temporaryPassword]],
      "ระบบจำรหัสนี้ไว้ถาวร · ดู/แก้ได้ที่คอลัมน์รหัสผ่านหรือปุ่มแก้ไข");
  }catch(err){ toast(err.message,"bad"); }
}

async function deactivate(emp){
  if(!await confirmDialog("ปิดใช้งานพนักงาน", `ปิดใช้งาน <b>${esc(emp.name)}</b>?<br>ประวัติเวลางาน เงินเดือน และ audit จะยังอยู่ครบ`, {danger:true, okText:"ปิดใช้งาน"})) return;
  try{
    await api("admin_upsert_employee",{employeeId:emp.id, name:emp.name, role:emp.role||"Employee",
      siteId:emp.siteId, department:emp.department||"", status:"inactive", locationRequired:emp.locationRequired, updatedBy:state.reviewer||"Admin"});
    await loadEmployees(true); renderEmployees(); toast("ปิดใช้งานแล้ว","good");
  }catch(err){ toast(err.message,"bad"); }
}

function showSecret(title, rows, hint){
  const body=el(`<div></div>`);
  rows.forEach(([k,v])=>body.append(el(`<div class="secretbox"><b>${esc(k)}</b><div class="v">${esc(v)}</div></div>`)));
  if(hint) body.append(el(`<div class="notice" style="margin-top:14px">${esc(hint)}</div>`));
  const copy=el(`<button class="btn sub">คัดลอกรหัส</button>`);
  copy.onclick=()=>{ navigator.clipboard?.writeText(rows.map(r=>r[1]).join(" ")); toast("คัดลอกแล้ว"); };
  const ok=el(`<button class="btn">เรียบร้อย</button>`); ok.onclick=closeModal;
  openModal(title, body, [copy, ok]);
}

async function reviewLeave(btn, requestId, decision){

  await withBtn(btn, async ()=>{
    try{ await api("admin_review_leave",{requestId, decision, reviewer:state.reviewer||"Admin"});
      toast("บันทึกการ"+(decision==="approved"?"อนุมัติ":"ปฏิเสธ")+"แล้ว","good"); renderApprovals(); refreshApprovalBadge();
    }catch(err){ toast(err.message,"bad"); }

}
async function reviewTime(btn, requestId, decision){

  if(decision==="rejected"){
    note=prompt("หมายเหตุถึงพนักงาน (ไม่บังคับ):")||"";
  }
  await withBtn(btn, async ()=>{
    try{ await api("admin_review_time_request",{requestId, decision, reviewer:state.reviewer||"Admin", reviewerNote:note});
      toast("บันทึกการ"+(decision==="approved"?"อนุมัติ":"ปฏิเสธ")+"แล้ว","good"); renderApprovals(); refreshApprovalBadge();
    }catch(err){ toast(err.message,"bad"); }
  });
}

function exportCSV(data, kind){
  const rows=[["payroll_id","employee_id","employee_name","regular_minutes","ot_minutes","base_gross","ot_gross","gross_pay","advance_deduction","net_pay"]];
  (data.lines||[]).forEach(l=>rows.push([
    data.payrollId||("PREVIEW "+data.startDate+".."+data.endDate), l.employeeId, empName(l.employeeId),
    l.regularMinutes||0, l.otMinutes||0, l.baseGross||0, l.otGross||0, l.grossPay||0,
    l.advanceDeduction||0, (l.netPay!=null?l.netPay:l.grossPay)||0]));
  const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a"); a.href=url;
  a.download=(data.payrollId||("payroll_"+kind+"_"+(data.startDate||todayISO())))+".csv"; a.click();
  URL.revokeObjectURL(url); toast("ส่งออก CSV แล้ว","good");
}

      }catch(err){ tb.innerHTML=`<tr><td colspan="6"><div class="empty">${esc(err.message)}</div></td></tr>`; } };
    sel.onchange=()=>{ ownerState.emp=sel.value; loadAtt(); };

async function adminClock(eventType){
  if(!ownerState.emp){ toast("เลือกพนักงานก่อน (ต้องไม่ใช่ 'ทุกคน')","bad"); return; }
  const emp=(state.employees||[]).find(e=>e.id===ownerState.emp);
  const label=eventType==="check_in"?"ลงเวลาเข้า":"ลงเวลาออก";

  try{ const d=await api("admin_record_attendance",{employeeId:ownerState.emp, eventType, reviewer:state.reviewer||"Admin"});
    toast(d.message||"บันทึกแล้ว","good"); renderOwner();
  }catch(err){ toast(err.message,"bad"); }
}

  [["1","จันทร์"],["2","อังคาร"],["3","พุธ"],["4","พฤหัส"],["5","ศุกร์"],["6","เสาร์"],["0","อาทิตย์"]].forEach(([v,n])=>{

async function siteDialog(site){
  if(site===undefined){ try{ const d=await api("admin_list_sites"); site=(d.sites||[])[0]||null; }catch(_){ site=null; } }
  const body=el(`<div></div>`);
  body.append(field("รหัสร้าน/ไซต์", `<input id="tSite" type="text" value="${esc(site?site.siteId:"BVN-HQ")}">`, "ต้องตรงกับช่อง “รหัสไซต์” ของพนักงานที่บังคับ GPS"));
  body.append(field("ชื่อร้าน", `<input id="tName" type="text" value="${esc(site?site.name:"")}">`));
  const g=el(`<div class="grid2"></div>`);
  g.append(field("Latitude", `<input id="tLat" type="text" value="${site?site.lat:""}">`), field("Longitude", `<input id="tLng" type="text" value="${site?site.lng:""}">`));
  body.append(g);
  body.append(field("รัศมีอนุญาต (เมตร)", `<input id="tRad" type="number" min="1" value="${site?site.radius:200}">`, "พนักงานต้องอยู่ในรัศมีนี้ถึงจะเช็กอินผ่าน"));
  const paste=field("วางพิกัดจาก Google Maps", `<input id="tPaste" type="text" placeholder="13.7629, 100.5582">`, "คัดลอกพิกัดจาก Google Maps มาวาง แล้วช่อง Lat/Lng จะเติมให้อัตโนมัติ");
  body.append(paste);
  paste.querySelector("#tPaste").oninput=(e)=>{ const m=/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/.exec(e.target.value); if(m){ $("#tLat").value=m[1]; $("#tLng").value=m[2]; } };
  const cancel=el(`<button class="btn sub">ยกเลิก</button>`); cancel.onclick=closeModal;
  const save=el(`<button class="btn">บันทึก</button>`);
  save.onclick=()=>withBtn(save, async ()=>{
    const lat=parseFloat($("#tLat").value), lng=parseFloat($("#tLng").value), radius=parseFloat($("#tRad").value);
    if(!$("#tSite").value.trim()||isNaN(lat)||isNaN(lng)||!(radius>0)){ toast("กรอกรหัสไซต์ พิกัด และรัศมีให้ครบ","bad"); return; }
    try{ await api("admin_save_site",{siteId:$("#tSite").value.trim(), name:$("#tName").value.trim(), lat, lng, radius});
      closeModal(); toast("บันทึกตำแหน่งร้านแล้ว","good"); renderOwner();
    }catch(err){ toast(err.message,"bad"); }
  });
  openModal("ตั้งค่าตำแหน่งร้าน (GPS)", body, [cancel, save]);
}

          <tbody id="advRows"></tbody></table></div>

async function decideAdvance(id, decision){

  try{ await api("admin_decide_advance",{advanceId:id, decision, reviewer:state.reviewer||"Admin"}); toast("บันทึกแล้ว","good"); renderAdvances(); }
  catch(err){ toast(err.message,"bad"); }
}

  try{ await api("admin_mark_advance_paid",{advanceId:id}); toast("บันทึกการจ่ายแล้ว","good"); renderAdvances(); }
  catch(err){ toast(err.message,"bad"); }
}

          ${i.paymentReference?`<div><span class="k">อ้างอิงการชำระ</span> <b>${esc(i.paymentReference)}</b></div>`:""}
        </div>
      </div>
      <table><thead><tr><th>รายการ</th><th class="num">จำนวนเงิน (บาท)</th></tr></thead>
        <tbody><tr><td>${esc(i.description||"-")}</td><td class="num">${money(i.subtotal)}</td></tr></tbody></table>
      <div class="totals">
        <div><span>ยอดก่อนภาษี</span><span>${money(i.subtotal)}</span></div>
        <div><span>ภาษีมูลค่าเพิ่ม 7%</span><span>${money(i.vat)}</span></div>
        <div class="grand"><span>ยอดรวมทั้งสิ้น</span><span>฿${money(i.total)}</span></div>
      </div>
      <div class="foot">
        <div>หมายเหตุ: กรุณาชำระภายในวันครบกำหนด</div>
        <div class="sign"><div class="line">ผู้มีอำนาจลงนาม<br>${esc(ISSUER.name)}</div></div>
      </div>
    </div></body></html>`;
  const w=window.open("","_blank");
  if(!w){ toast("เบราว์เซอร์บล็อก popup — อนุญาตแล้วลองใหม่","bad"); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

function printPayslip(l, period){
  if(!l){ toast("ไม่พบข้อมูลพนักงาน","bad"); return; }
  const money=(n)=>Number(n||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
  const hrs=(m)=>{ m=Number(m||0); return (Math.floor(m/60))+" ชม. "+(m%60)+" นาที"; };
  const dateTh=(iso)=>{ if(!iso) return "—"; const d=new Date(iso.length<=10?iso+"T00:00:00+07:00":iso); return isNaN(d)?esc(iso):d.toLocaleDateString("th-TH",{dateStyle:"long"}); };
  const today=new Date().toLocaleDateString("th-TH",{dateStyle:"long"});
  const periodText=(period&&period.start)?(dateTh(period.start)+" – "+dateTh(period.end)):(period&&period.label?esc(period.label):"—");
  const gross=Number(l.grossPay||0), adv=Number(l.advanceDeduction||0), net=l.netPay!=null?Number(l.netPay):gross-adv;
  const html=`<!doctype html><html lang="th"><head><meta charset="utf-8">
    <title>สลิปเงินเดือน ${esc(l.name||l.employeeId)}</title>
    <style>
      *{box-sizing:border-box} body{font-family:"Sarabun","TH Sarabun New","Tahoma",sans-serif;color:#111;margin:0;padding:24px;background:#f3f4f6}
      .sheet{max-width:620px;margin:0 auto;background:#fff;padding:40px 44px;box-shadow:0 1px 6px rgba(0,0,0,.12)}
      .top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0f766e;padding-bottom:16px}
      .co-name{font-size:19px;font-weight:700;color:#0f766e;margin:0} .co-en{font-size:12px;color:#374151;margin:2px 0 8px}
      .co-line{font-size:12px;color:#374151;line-height:1.5}
      .doc-title{text-align:right} .doc-title h1{font-size:22px;margin:0;letter-spacing:1px;color:#111} .doc-title .sub{font-size:11px;color:#6b7280}
      .meta{display:flex;justify-content:space-between;margin-top:20px;gap:24px;font-size:13px;line-height:1.7} .meta .k{color:#6b7280}
      table{width:100%;border-collapse:collapse;margin-top:22px;font-size:14px}
      th{background:#0f766e;color:#fff;text-align:left;padding:9px 12px;font-weight:600} th.num,td.num{text-align:right}
      td{padding:9px 12px;border-bottom:1px solid #e5e7eb}
      .totals{margin-top:14px;margin-left:auto;width:300px;font-size:14px}
      .totals div{display:flex;justify-content:space-between;padding:6px 2px}
      .totals .ded{color:#b91c1c}
      .totals .grand{border-top:2px solid #0f766e;margin-top:4px;padding-top:10px;font-size:18px;font-weight:700;color:#0f766e}
      .foot{margin-top:40px;display:flex;justify-content:space-between;font-size:13px;color:#374151}
      .sign{text-align:center;width:200px} .sign .line{margin-top:48px;border-top:1px dotted #9ca3af;padding-top:6px}
      .note{margin-top:8px;font-size:11px;color:#6b7280}
      .toolbar{max-width:620px;margin:0 auto 14px;text-align:right}
      .pbtn{font:inherit;font-size:14px;padding:8px 18px;border:0;border-radius:8px;background:#0f766e;color:#fff;cursor:pointer}
      @media print{body{background:#fff;padding:0}.sheet{box-shadow:none;max-width:none;padding:24px}.toolbar{display:none}}
    </style></head><body>
    <div class="toolbar"><button class="pbtn" onclick="window.print()">พิมพ์ / บันทึก PDF</button></div>
    <div class="sheet">
      <div class="top">
        <div>
          <p class="co-name">${esc(ISSUER.name)}</p>
          <p class="co-en">${esc(ISSUER.nameEn)}</p>
          <div class="co-line">${esc(ISSUER.address)}</div>
          <div class="co-line">เลขประจำตัวผู้เสียภาษี ${esc(ISSUER.taxId)}</div>
        </div>
        <div class="doc-title"><h1>สลิปเงินเดือน</h1><div class="sub">PAYSLIP</div></div>
      </div>
      <div class="meta">
        <div><div><span class="k">พนักงาน</span> <b>${esc(l.name||l.employeeId)}</b></div><div><span class="k">รหัส</span> ${esc(l.employeeId)}${l.role?" · "+esc(l.role):""}</div></div>
        <div style="text-align:right"><div><span class="k">งวด</span> <b>${periodText}</b></div><div><span class="k">ออกเมื่อ</span> ${today}</div></div>
      </div>
      <table><thead><tr><th>รายการ</th><th class="num">จำนวน</th><th class="num">เงิน (บาท)</th></tr></thead>
        <tbody>
          <tr><td>ค่าแรงฐาน · ${fmtInt(l.workDays)} วัน (${hrs(l.regularMinutes)})</td><td class="num">—</td><td class="num">${money(l.baseGross)}</td></tr>
          ${Number(l.otGross||0)?`<tr><td>ค่าล่วงเวลา (OT) · ${hrs(l.otMinutes)}</td><td class="num">—</td><td class="num">${money(l.otGross)}</td></tr>`:""}
        </tbody></table>
      <div class="totals">
        <div><span>รวมรายได้ (gross)</span><span>${money(gross)}</span></div>
        <div class="ded"><span>หักเงินเบิกล่วงหน้า</span><span>${adv?"-"+money(adv):money(0)}</span></div>
        <div class="grand"><span>เงินสุทธิที่จ่ายจริง</span><span>฿${money(net)}</span></div>
      </div>
      <div class="note">* รายได้ก่อนหักภาษี ณ ที่จ่าย และประกันสังคม (ยังไม่รวมในสลิปนี้) · หักเบิกคือยอดเบิกล่วงหน้าที่อนุมัติแล้วและยังไม่ได้จ่ายคืน</div>
      <div class="foot">
        <div>ลงชื่อผู้รับเงิน</div>
        <div class="sign"><div class="line">ผู้จ่ายเงิน<br>${esc(ISSUER.name)}</div></div>
      </div>
    </div></body></html>`;
  const w=window.open("","_blank");
  if(!w){ toast("เบราว์เซอร์บล็อก popup — อนุญาตแล้วลองใหม่","bad"); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

function newInvoiceDialog(){
  const body=el(`<div></div>`);
  body.append(
    field("ลูกค้า", `<input id="iCust" type="text" required>`),
    field("รายละเอียด", `<textarea id="iDesc" rows="2"></textarea>`),
  );
  const g=el(`<div class="grid2"></div>`);
  g.append(
    field("ยอดก่อน VAT (บาท)", `<input id="iSub" type="number" min="0" step="0.01">`),
    field("ครบกำหนด", `<input id="iDue" type="date" value="${todayISO()}">`),
  );
  body.append(g);
  const vatLine=el(`<div class="notice blue" style="margin-top:4px">VAT 7% และยอดรวมจะคำนวณโดยเซิร์ฟเวอร์</div>`);
  body.append(vatLine);
  const sub=g.querySelector("#iSub");
  sub.oninput=()=>{ const s=parseFloat(sub.value)||0; vatLine.innerHTML=`VAT 7% = <b>${fmtBaht(s*0.07)}</b> · ยอดรวม = <b>${fmtBaht(s*1.07)}</b>`; };
  const cancel=el(`<button class="btn sub">ยกเลิก</button>`); cancel.onclick=closeModal;
  const save=el(`<button class="btn">สร้างใบแจ้งหนี้</button>`);
  save.onclick=()=>withBtn(save, async ()=>{
    const customer=$("#iCust").value.trim(), description=$("#iDesc").value.trim(), subtotal=parseFloat($("#iSub").value), dueDate=$("#iDue").value;
    if(!customer||!description||!(subtotal>=0)||!dueDate){ toast("กรอกข้อมูลให้ครบ","bad"); return; }
    try{ await api("admin_create_invoice",{customer, description, subtotal, dueDate});
      closeModal(); renderInvoices(); toast("สร้างใบแจ้งหนี้แล้ว (สถานะ: ร่าง)","good");
    }catch(err){ toast(err.message,"bad"); }
  });
  openModal("สร้างใบแจ้งหนี้ใหม่", body, [cancel, save]);
}

async function invStatus(btn, invoiceNo, status){
  const verb={issued:"ออกบิล","void":"ยกเลิก"}[status];
  if(status==="void" && !await confirmDialog("ยกเลิกใบแจ้งหนี้",`ยกเลิก <b>${esc(invoiceNo)}</b>?`,{danger:true,okText:"ยกเลิกบิล"})) return;
  await withBtn(btn, async ()=>{
    try{ await api("admin_update_invoice_status",{invoiceNo, status}); toast(verb+"แล้ว","good"); renderInvoices(); }
    catch(err){ toast(err.message,"bad"); }
  });
}
function payInvoice(invoiceNo){
  const body=el(`<div></div>`);
  body.append(field("เลขอ้างอิงการชำระ (payment reference)", `<input id="payRef" type="text" placeholder="เช่น เลขสลิป / เลขโอน" required>`,
    "จำเป็นต้องมีเมื่อเปลี่ยนสถานะเป็น “ชำระแล้ว”"));
  const cancel=el(`<button class="btn sub">ยกเลิก</button>`); cancel.onclick=closeModal;
  const ok=el(`<button class="btn ok">บันทึกชำระ</button>`);
  ok.onclick=()=>withBtn(ok, async ()=>{
    const paymentReference=$("#payRef").value.trim();
    if(!paymentReference){ toast("กรอกเลขอ้างอิงก่อน","bad"); return; }
    try{ await api("admin_update_invoice_status",{invoiceNo, status:"paid", paymentReference});
      closeModal(); renderInvoices(); toast("บันทึกการชำระแล้ว","good");
    }catch(err){ toast(err.message,"bad"); }
  });
  openModal("บันทึกการชำระ "+invoiceNo, body, [cancel, ok]);
}

(function resume(){

  if(!token) return;
  state.endpoint=endpoint; state.token=token; state.reviewer=reviewer;
