name: Deploy BVN web applications

on:
  push:
    branches: [main]
    paths:
      - 'admin_codex/**'
      - 'employee_mobile/**'
      - 'tools/build_admin.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build admin console
        run: node tools/build_admin.mjs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Build employee PWA
        working-directory: employee_mobile
        run: |
          flutter pub get
          flutter build web --release --base-href /Workforce_Operations_Hub/employee/

      - name: Stage both applications
        run: |
          mkdir -p _pages/admin_codex _pages/employee
          cp -R admin_codex/. _pages/admin_codex/
          cp -R employee_mobile/build/web/. _pages/employee/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
